<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cantilever Beam: Slope and Deflection</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #f7f9fc; }
  canvas { background: #fff; border: 1px solid #ccc; margin-top: 10px; }
  select, button { font-size: 16px; margin: 6px; }
</style>
</head>
<body>
<h2>Slope and Deflection of a Cantilever Beam</h2>
<div>
  Load case:
  <select id="case">
    <option value="udl">Full-span UDL (w)</option>
    <option value="point">Point load at free end (P)</option>
  </select>
  <button id="pause">Pause</button>
</div>
<canvas id="c" width="900" height="440"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const L = 3, EI = 20000;            // m, kN·m²
const w = 10, P = 20;               // kN/m, kN
const x0 = 130, x1 = 780, yb = 140; // pixel mapping of the beam axis
const scale = 10000;                // deflection exaggeration
const pxPerM = (x1 - x0) / L;
let t = 0, paused = false;
document.getElementById('pause').onclick = e => {
  paused = !paused; e.target.textContent = paused ? 'Play' : 'Pause';
};

// Downward deflection (m) and slope (rad), x measured from the fixed end
function defl(x, k) {
  return k === 'udl'
    ? w * x*x * (6*L*L - 4*L*x + x*x) / (24*EI)
    : P * x*x * (3*L - x) / (6*EI);
}
function slope(x, k) {
  return k === 'udl'
    ? w * x * (3*L*L - 3*L*x + x*x) / (6*EI)
    : P * x * (2*L - x) / (2*EI);
}
const tipSlope = k => k === 'udl' ? w*L**3/(6*EI)  : P*L*L/(2*EI);
const tipDefl  = k => k === 'udl' ? w*L**4/(8*EI)  : P*L**3/(3*EI);
const px = x => x0 + x * pxPerM;

function draw() {
  const k = document.getElementById('case').value;
  const f = 0.5 - 0.5 * Math.cos(t);   // smooth load factor 0 -> 1 -> 0
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.font = '16px Arial';

  // fixed support (wall with hatching)
  ctx.fillStyle = '#343a40'; ctx.fillRect(x0 - 14, yb - 60, 14, 120);
  ctx.strokeStyle = '#343a40'; ctx.lineWidth = 2;
  for (let y = yb - 60; y < yb + 60; y += 12) {
    ctx.beginPath(); ctx.moveTo(x0 - 14, y + 10); ctx.lineTo(x0 - 30, y); ctx.stroke();
  }
  ctx.fillStyle = '#212529'; ctx.fillText('A (fixed)', x0 - 70, yb + 85);
  ctx.fillText('B (free)', x1 - 25, yb - 20);

  // loads
  ctx.strokeStyle = '#d9480f'; ctx.fillStyle = '#d9480f'; ctx.lineWidth = 2;
  if (k === 'udl') {
    for (let i = 0; i <= 13; i++) {
      const x = x0 + i * (x1 - x0) / 13, h = 50 * Math.max(f, 0.2);
      const y = yb + f * scale * defl(i / 13 * L, k);
      ctx.beginPath(); ctx.moveTo(x, y - 20 - h); ctx.lineTo(x, y - 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 5, y - 18); ctx.lineTo(x, y - 8); ctx.lineTo(x + 5, y - 18); ctx.stroke();
    }
    ctx.fillText('w = 10 kN/m', (x0 + x1) / 2 - 40, yb - 100);
  } else {
    const yt = yb + f * scale * tipDefl(k), h = 80 * Math.max(f, 0.2);
    ctx.beginPath(); ctx.moveTo(x1, yt - 12 - h); ctx.lineTo(x1, yt - 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1 - 7, yt - 18); ctx.lineTo(x1, yt - 6); ctx.lineTo(x1 + 7, yt - 18); ctx.stroke();
    ctx.fillText('P = 20 kN', x1 - 35, yt - 20 - h);
  }

  // original axis
  ctx.setLineDash([6, 4]); ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, yb); ctx.lineTo(x1 + 40, yb); ctx.stroke(); ctx.setLineDash([]);

  // deflected beam
  ctx.strokeStyle = '#1c7ed6'; ctx.lineWidth = 6; ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const x = i / 120 * L, y = yb + f * scale * defl(x, k);
    i ? ctx.lineTo(px(x), y) : ctx.moveTo(px(x), y);
  }
  ctx.stroke();

  // slope tangent at the free end
  const yt = yb + f * scale * tipDefl(k);
  const ang = Math.atan(f * scale * tipSlope(k) / pxPerM);
  ctx.strokeStyle = '#2f9e44'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x1 - 110 * Math.cos(ang), yt - 110 * Math.sin(ang));
  ctx.lineTo(x1 + 70 * Math.cos(ang), yt + 70 * Math.sin(ang)); ctx.stroke();
  ctx.fillStyle = '#2f9e44'; ctx.fillText('θB', x1 + 45, yt + 30);

  // maximum deflection marker at free end
  ctx.strokeStyle = '#c2255c'; ctx.beginPath();
  ctx.moveTo(x1 + 40, yb); ctx.lineTo(x1 + 40, yt); ctx.stroke();
  ctx.fillStyle = '#c2255c'; ctx.fillText('y_max', x1 + 48, (yb + yt) / 2 + 5);

  // readouts
  ctx.fillStyle = '#212529';
  const th = tipSlope(k) * f, d = tipDefl(k) * f * 1000;
  ctx.fillText(`Load factor: ${(f * 100).toFixed(0)}%   (L = 3 m, EI = 20000 kN·m²)`, 100, 310);
  ctx.fillText(`Slope at free end θB = ${th.toFixed(5)} rad   (full load: ${k === 'udl' ? 'wL³/6EI' : 'PL²/2EI'})`, 100, 340);
  ctx.fillText(`Max deflection at free end = ${d.toFixed(2)} mm   (full load: ${k === 'udl' ? 'wL⁴/8EI' : 'PL³/3EI'})`, 100, 370);
  ctx.fillText('Slope and deflection are zero at the fixed end. Deflection is exaggerated for visibility.', 100, 410);
}
function loop() { if (!paused) t += 0.02; draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
